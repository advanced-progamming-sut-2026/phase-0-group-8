buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

/**
 * Small, dependency-free source linter used by the Phase 2 checklist. The
 * libGDX-generated StartupHelper keeps its upstream tab formatting, so it is
 * excluded; all student-owned Java sources must use spaces and have no
 * trailing whitespace.
 */
tasks.register('phase2Lint') {
  group = 'verification'
  description = 'Checks student Java sources for tabs and trailing whitespace.'

  doLast {
    def violations = []
    fileTree(rootDir) {
      include '**/src/**/*.java'
      exclude '**/build/**'
      exclude '**/lwjgl3/src/main/java/**/StartupHelper.java'
    }.files.sort().each { sourceFile ->
      sourceFile.readLines('UTF-8').eachWithIndex { line, index ->
        if (line.contains('\t')) {
          violations << "${rootDir.toPath().relativize(sourceFile.toPath())}:${index + 1}: tab character"
        }
        if (line != line.replaceFirst(/\s+$/, '')) {
          violations << "${rootDir.toPath().relativize(sourceFile.toPath())}:${index + 1}: trailing whitespace"
        }
      }
    }

    if (!violations.isEmpty()) {
      throw new GradleException("Phase 2 lint found ${violations.size()} error(s):\n" + violations.join('\n'))
    }
    logger.lifecycle('Phase 2 lint: 0 errors')
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17

  dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
  }

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }

  tasks.named('check') {
    dependsOn rootProject.tasks.named('phase2Lint')
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'PvZ'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'PvZ' + '-parent'
